[project]
name = "quiet-feed"
version = "0.5.2"
description = "One frozen daily edition of your feeds."
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44",
  "defusedxml>=0.7.1",
  "fastapi>=0.115,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.28,<1",
  "jinja2>=3.1.5,<4",
  "nh3>=0.2.21,<1",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36,<2.2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
