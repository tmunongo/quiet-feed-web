services:
  quiet-feed:
    image: ghcr.io/tmunongo/quiet-feed-web:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        COMMIT_HASH: ${COMMIT_HASH:-}
        APP_VERSION: ${APP_VERSION:-}
    container_name: quiet-feed
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      # Update these two to your real domain before going live.
      ORIGIN: ${ORIGIN:-https://quiet-feed.example.com}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://quiet-feed.example.com}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENABLE_INTERNAL_SCHEDULER: ${ENABLE_INTERNAL_SCHEDULER:-true}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      DATABASE_PATH: /app/data/quiet-feed.db
    volumes:
      - quiet-feed-data:/app/data
    stop_grace_period: 5m
    # Remove this if you're not fronting with Traefik — then publish the
    # port directly instead, e.g. `ports: ["3000:3000"]`.
    labels:
      - traefik.enable=true
      - traefik.http.routers.quiet-feed.rule=Host(`quiet-feed.example.com`)
      - traefik.http.routers.quiet-feed.entrypoints=websecure
      - traefik.http.routers.quiet-feed.tls.certresolver=letsencrypt
      - traefik.http.services.quiet-feed.loadbalancer.server.port=3000
    networks:
      - traefik

volumes:
  quiet-feed-data:

networks:
  traefik:
    external: true
